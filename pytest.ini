[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --html=reports/html/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --dist=loadgroup
    --rerun-except=ApiQuotaExceededError
    --junitxml=reports/junit/results.xml
markers =
    api: API tests (ReqRes) - no browser needed
    ui: UI-only tests (OrangeHRM)
    hybrid: UI + API end-to-end tests
    smoke: fast critical checks
    e2e: end-to-end employee lifecycle scenario
    regression: extended coverage
    xdist_group: keep tests on the same parallel worker (used for the rate-limited ReqRes API)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
junit_family = xunit2
