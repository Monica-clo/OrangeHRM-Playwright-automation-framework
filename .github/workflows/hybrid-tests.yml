name: Hybrid Automation - OrangeHRM (UI + API)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"            # nightly (UTC)
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suites to run"
        type: choice
        options: [all, api, ui-hybrid]
        default: all
      browsers:
        description: "Browsers for UI / hybrid tests (one job per browser)"
        type: choice
        options: ['["chromium","firefox"]', '["chromium"]', '["firefox"]', '["chromium","firefox","webkit"]']
        default: '["chromium","firefox"]'
      workers:
        description: "Parallel workers (pytest-xdist -n)"
        type: choice
        options: ["1", "2", "4", "auto"]
        default: "2"
      data_source:
        description: "Employee test data source"
        type: choice
        options: [json, csv]
        default: json

permissions:
  contents: write          # needed only to publish the Allure report to gh-pages
  checks: write
  pull-requests: write

concurrency:
  group: hybrid-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME || 'Admin' }}
  ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD || 'admin123' }}
  REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

jobs:
  # ---------------------------------------------------------------- API
  api-tests:
    name: API tests (ReqRes)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'ui-hybrid' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API tests (no browser needed)
        run: |
          python -m pytest -m api --reruns 1 --reruns-delay 5 \
            --html=reports/html/api-report.html \
            --junitxml=reports/junit/api-results.xml
      - name: Publish API test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit/api-results.xml
          check_name: "API test results"
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------- UI + HYBRID
  ui-hybrid-tests:
    name: UI + Hybrid tests (${{ matrix.browser }}, ${{ inputs.workers || '2' }} workers)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers || '["chromium","firefox"]') }}
    env:
      BROWSER: ${{ matrix.browser }}
      WORKERS: ${{ inputs.workers || '2' }}
      DATA_SOURCE: ${{ inputs.data_source || 'json' }}
      RECORD_VIDEO: "true"
      TRACING: retain-on-failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps "$BROWSER"
      - name: Run UI and hybrid tests
        run: |
          python -m pytest -m "ui or hybrid" --browser "$BROWSER" -n "$WORKERS" --reruns 1 --reruns-delay 5 \
            --html=reports/html/ui-hybrid-report.html \
            --junitxml=reports/junit/ui-hybrid-results.xml
      - name: Publish UI test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit/ui-hybrid-results.xml
          check_name: "UI + Hybrid test results (${{ env.BROWSER }})"
      - name: Upload UI reports, videos, screenshots, traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-hybrid-reports-${{ env.BROWSER }}-${{ github.run_number }}
          path: reports/
          retention-days: 14

  # ---------------------------------------------------------------- COMBINED ALLURE REPORT
  allure-report:
    name: Combined Allure report
    needs: [api-tests, ui-hybrid-tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find downloaded -type d -name allure-results -exec sh -c 'cp -r "$1"/. allure-results/' _ {} \;
          ls allure-results | head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Allure report
        run: |
          npm install -g allure-commandline --silent
          allure generate allure-results -o allure-report --clean
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14
      - name: Publish to GitHub Pages (main branch only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure
